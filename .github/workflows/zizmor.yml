name: Workflow security lint (zizmor)
# Статический анализ workflow-файлов: zizmor ловит template injection, избыточные
# permissions и credential persistence — CodeQL и gitleaks YAML-workflows не видят.
# Батч W8 (пилот .github зелёный). SHA zizmor-action v0.8.1 и checkout v7.0.1
# верифицированы живым GET 2026-11-15.
on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: '17 2 * * 5'  # еженедельно, пятница
  workflow_dispatch:

permissions: read-all

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
        with:
          online-audits: false
          advanced-security: true
