name: CI

permissions:
  contents: read

on:
  workflow_dispatch: {}
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Сборка (locked — политика зависимостей)
        run: cargo build --locked --all-targets
      - name: Тесты
        run: cargo test --all
      - name: Self-test бинарника
        run: ./target/debug/neutral-browser --self-test
      - name: Гейт архитектуры (std-only python)
        run: python3 tests/architecture.py
      - name: Сканер молчания — негативный selftest + статика репо
        run: |
          python3 tools/silence_scan.py --selftest
          python3 tools/silence_scan.py
      - name: E2E «сертификат молчания» — живой прогон (локальный сервер, без внешней сети)
        run: python3 tools/e2e.py
      - name: Сертификат молчания ×6 — runtime-детектор внеполосных запросов (strace/LD_PRELOAD + строгий netns)
        run: |
          command -v strace >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq strace; }
          python3 tools/silence_e2e.py --certificate ./target/debug/neutral-browser --require-netns
      - name: Детектор молчания — негативный selftest
        run: python3 tools/silence_e2e.py --selftest
