name: РЕВО ОБХОД
on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  obhod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (pinned 2026-11-15, W8)
      - name: дежурная проверка оформления
        run: python3 revo_obhod.py --issue || true
